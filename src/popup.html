<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; font-family: sans-serif; padding: 10px; }
    .profile { 
      padding: 10px; 
      margin: 5px 0; 
      border: 1px solid #ccc; 
      border-radius: 4px; 
      cursor: pointer; 
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .profile.active { background: #e3f2fd; border-color: #1976d2; }
    .profile:hover { background: #f5f5f5; }
    .profile-info { flex: 1; }
    .profile-info strong { display: block; margin-bottom: 4px; }
    .profile-info small { color: #666; font-size: 0.85em; }
    .profile-controls { display: flex; align-items: center; gap: 8px; }
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .status-indicator.active { background: #4caf50; box-shadow: 0 0 4px #4caf50; }
    .status-indicator.inactive { background: #9e9e9e; }
    #stopBtn {
      background: #f44336;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #stopBtn:hover { background: #d32f2f; }
    #stopBtn:active { background: #b71c1c; }
    .delete { 
      color: #f44336; 
      font-weight: bold; 
      font-size: 20px; 
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
      border-radius: 3px;
      transition: background 0.2s;
    }
    .delete:hover { background: #ffebee; }
    button { margin-top: 10px; width: 100%; padding: 8px; cursor: pointer; }
    input, select { width: 100%; margin: 5px 0; padding: 5px; box-sizing: border-box; }
    .form { margin-top: 15px; font-size: 0.9em; }
  </style>
</head>
<body>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
    <h3 style="margin: 0;">Прокси-профили</h3>
    <button id="stopBtn" style="padding: 6px 12px; font-size: 0.85em; margin: 0;">⏹ Остановить</button>
  </div>
  <div id="profiles"></div>

  <div class="form">
    <input type="text" id="name" placeholder="Название">
    <select id="type">
      <option value="http">HTTP</option>
      <option value="socks5">SOCKS5</option>
    </select>
    <input type="text" id="host" placeholder="IP (например, 1.2.3.4)">
    <input type="text" id="port" placeholder="Порт (например, 8080)">
    <button id="add">Добавить профиль</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
